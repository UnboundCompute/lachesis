name: CI

# Runs the parity/checks suite across the supported Python versions. The Kuzu
# columnar store is the graph store and a required dependency, so every job
# installs it and the floor is Python 3.10.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so a fast-follow push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (py${{ matrix.python-version }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            extras: "dev"
          - python-version: "3.11"
            extras: "dev"
          - python-version: "3.12"
            extras: "dev"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install the TypeScript compiler the TS frontend loads
        run: npm ci

      - name: Upgrade pip (editable installs need pip >= 21.3)
        run: python -m pip install --upgrade pip

      - name: Install Lachesis (${{ matrix.extras }})
        run: python -m pip install -e ".[${{ matrix.extras }}]"

      # The catalog-keyed temporal logic tests read the sink/lifecycle tables from a
      # bundled catalog; without it they see an empty table and misjudge. Stage the
      # pinned catalog so those tests run against real data. The native-binary tests
      # skip themselves here (no kernel is built in this job) via native_lifetime.available().
      - name: Vendor the pinned Atropos catalog
        run: python3 tools/vendor_atropos.py

      - name: Run the local parity gate
        run: make check

  # The checks matrix runs the pure-Python suite; its native-dependent tests skip
  # themselves because no lifetime kernel is staged there. This job is where the native
  # temporal pipeline is actually exercised: it builds the Rust lifetime kernel and the
  # C frontend, provides a libclang for the frontend to load at runtime, stages the
  # catalog, and runs the four test files that drive the kernel end to end (federated
  # shard build/merge and the FP/FN corpus gate). A break in the native path shows up
  # here rather than silently skipping.
  native:
    name: native (lifetime kernel + C frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install the TypeScript compiler the TS frontend loads
        run: npm ci

      # The C frontend loads libclang at runtime (clang-sys "runtime" feature, clang 17
      # API), and the corpus fixtures are compiled by clang itself. Install both and point
      # the loader at the matching libclang so no host default (a newer/older libclang) is
      # picked up instead.
      - name: Install clang 17 and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 libclang-17-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-17/lib" >> "$GITHUB_ENV"

      - name: Upgrade pip (editable installs need pip >= 21.3)
        run: python -m pip install --upgrade pip

      - name: Install Lachesis (dev)
        run: python -m pip install -e ".[dev]"

      # Point the catalog resolver at the vendored tree explicitly. The corpus runner
      # otherwise setdefault()s ATROPOS_ROOT to a sibling `../atropos` checkout, which
      # does not exist on a runner; that nonexistent path would shadow the bundled
      # catalog and every lifecycle table would read empty, so the census would confirm
      # nothing. Exporting it here pre-empts the setdefault for both the build and the
      # census, so they read the catalog we just staged.
      - name: Vendor the pinned Atropos catalog
        run: |
          python3 tools/vendor_atropos.py
          echo "ATROPOS_ROOT=$PWD/lachesis/_atropos_catalog" >> "$GITHUB_ENV"

      - name: Build and stage the native artifacts
        run: python3 tools/stage_native.py --build

      # Kuzu reserves its store's address space by mmap-ing a sparse file at an 8 TiB
      # default when a database opens; the runner cannot satisfy that mapping even
      # with overcommit allowed (Mmap for size 8796093022208 failed), so cap the
      # reservation for the tiny corpus/shard graphs. LACHESIS_KUZU_MAX_DB_SIZE is a
      # power-of-two byte ceiling (2 GiB here) honoured at every store open; the
      # graphs are kilobytes, so the emitted store is byte-identical to the default.
      - name: Run the native lifetime suite
        env:
          LACHESIS_KUZU_MAX_DB_SIZE: "2147483648"
        run: |
          python -m pytest -q \
            lachesis/planner/test_temporal_native.py \
            lachesis/nav/test_federation.py \
            lachesis/test_cross_tu_merge.py \
            lachesis/planner/test_lifetime_corpus.py

  # A green checks job says nothing about what a user gets from PyPI: it runs from a
  # checkout, with an editable install, a node_modules and the repository root on
  # sys.path. This job builds the actual distribution and drives it from a clean
  # virtualenv in a temporary directory, which is the only place a packaging mistake
  # shows up. It deliberately does NOT run `npm ci` -- the TypeScript analysis here has
  # to succeed on the vendored compiler alone, exactly as it must for a user.
  package:
    name: package (build + verify the wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Vendor the pinned TypeScript compiler
        run: |
          python3 tools/vendor_typescript.py
          python3 tools/vendor_typescript.py --check

      - name: Build and stage the native artifacts
        run: python3 tools/stage_native.py --build

      - name: Anchor release timestamps
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build the sdist and wheel
        run: python -m build

      - name: Verify reproducible distributions
        run: |
          python tools/normalize_sdist.py dist/lachesis_cpg-*.tar.gz --epoch "$SOURCE_DATE_EPOCH"
          sha256sum dist/* > /tmp/lachesis-first-build.sha256
          python -m build
          python tools/normalize_sdist.py dist/lachesis_cpg-*.tar.gz --epoch "$SOURCE_DATE_EPOCH"
          sha256sum -c /tmp/lachesis-first-build.sha256

      - name: Check the distribution metadata
        run: python -m twine check dist/*

      - name: Verify the wheel from a clean virtualenv
        run: tools/verify_wheel.sh

      - name: Verify an install from the sdist
        # pip falls back to the sdist whenever a wheel is unavailable, and that path
        # re-runs the build backend, so it can ship a different set of files.
        run: tools/verify_sdist.sh

      - name: Keep the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/
