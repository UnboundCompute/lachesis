name: CI

# Runs the parity/checks suite across the supported Python versions. The Kuzu
# columnar store is the graph store and a required dependency, so every job
# installs it and the floor is Python 3.10.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a fast-follow push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (py${{ matrix.python-version }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            extras: "dev"
          - python-version: "3.11"
            extras: "dev"
          - python-version: "3.12"
            extras: "dev"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install the TypeScript compiler the TS frontend loads
        run: npm ci

      - name: Upgrade pip (editable installs need pip >= 21.3)
        run: python -m pip install --upgrade pip

      - name: Install Lachesis (${{ matrix.extras }})
        run: pip install -e ".[${{ matrix.extras }}]"

      - name: Run the parity / checks suite
        run: python -m pytest lachesis/frontends/checks.py -v
