name: leak-guard

# Two guards that protect the open/closed boundary:
#   1. moat-denylist - fails if any closed-engine codename appears in a tracked
#      file. Lachesis is the open infrastructure; the detection/exploitation
#      engine that consumes it stays private. This catches an accidental paste
#      or an over-broad copy before it ever reaches a reviewer.
#   2. secret-scan - gitleaks over the full history for credentials/keys.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version="8.30.1"
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          echo "Installing gitleaks v${version}"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        # git-aware scan: gitignored/untracked build artifacts (graph_out/, etc.)
        # are not scanned, which is why the generated-graph false positives that
        # tripped an earlier manual run do not appear here.
        run: gitleaks detect --no-banner --redact --source .
