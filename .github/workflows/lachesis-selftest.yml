# Dogfood: run the published Lachesis Action on this repo's own source.
# Lachesis analyzing itself. A healthy run surfaces the guard differentials in
# its own tree (fixtures excluded) into the Security tab as a deterministic
# smoke test. The Action itself lives at UnboundCompute/lachesis-action.
name: lachesis-selftest

on:
  workflow_dispatch:        # run on demand from the Actions tab
  push:
    branches: [main]        # establish the default-branch baseline (what the Security tab shows by default)
  pull_request:
    paths:
      - ".github/workflows/lachesis-selftest.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning (same-repo only; fork PRs can't)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: UnboundCompute/lachesis-action@51d7593825790ab01aa65887b0ad67d2366f306c # v1.0.0
        with:
          # Scan the whole repo (Python + TypeScript + C), not just a fixture:
          # the real dogfood is Lachesis analyzing its own source.
          source: "."
          # Test the engine at this repo's own HEAD, not the Action's default main.
          lachesis-ref: ${{ github.sha }}
          analyze-args: "--prune --incremental"
          # Drop every bundled test fixture from the report (c/python/typescript
          # frontends + planner): they carry deliberate guard differentials that
          # would otherwise drown the real findings in Lachesis's own source.
          exclude: "**/fixtures/**"
          fail-on: "none"                      # smoke test: never fail the check
