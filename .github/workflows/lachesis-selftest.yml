# Dogfood: run the published Lachesis Action on this repo's own source.
# Lachesis analyzing itself, as a deterministic smoke test that surfaces the
# guard differentials in its own tree (fixtures excluded). On pull requests the
# findings post as Lachesis[bot] comments; on push it just exercises the scan.
# The Action itself lives at UnboundCompute/lachesis-action.
name: lachesis-selftest

on:
  workflow_dispatch:        # run on demand from the Actions tab
  push:
    branches: [main]        # exercise a full scan on the default branch
  pull_request:
    paths:
      - ".github/workflows/lachesis-selftest.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write          # prove the repo to the Lachesis app so it can post as Lachesis[bot]
    steps:
      - uses: actions/checkout@v7

      - uses: UnboundCompute/lachesis-action@v1.0.4
        with:
          # Scan the whole repo (Python + TypeScript + C), not just a fixture:
          # the real dogfood is Lachesis analyzing its own source.
          source: "."
          analyze-args: "--prune --incremental"
          # Drop every bundled test fixture from the report (c/python/typescript
          # frontends + planner): they carry deliberate guard differentials that
          # would otherwise drown the real findings in Lachesis's own source.
          exclude: "**/fixtures/**"
          fail-on: "none"                      # smoke test: never fail the check
