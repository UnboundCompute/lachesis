name: release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: verify release distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as manifest:
              package_version = tomllib.load(manifest)["project"]["version"]
          if tag_version != package_version:
              raise SystemExit(
                  f"tag v{tag_version} does not match pyproject version {package_version}"
              )
          print(f"release version: {package_version}")
          PY
      - name: Verify tag has changelog entry
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          heading = f"## [{version}]"
          if heading not in Path("CHANGELOG.md").read_text(encoding="utf-8"):
              raise SystemExit(f"CHANGELOG.md has no release heading for {version}")
          print(f"changelog entry: {heading}")
          PY
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Vendor the TypeScript compiler
        run: |
          python3 tools/vendor_typescript.py
          python3 tools/vendor_typescript.py --check
      - name: Anchor release timestamps
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build distributions
        run: python -m build
      - name: Verify reproducible distributions
        run: |
          sha256sum dist/* > /tmp/lachesis-first-build.sha256
          python -m build
          sha256sum -c /tmp/lachesis-first-build.sha256
      - name: Verify metadata and clean-install behavior
        run: |
          python -m twine check dist/*
          tools/verify_wheel.sh
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lachesis-${{ github.ref_name }}
          path: dist/
