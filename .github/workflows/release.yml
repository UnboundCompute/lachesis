name: release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: verify release distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Vendor the TypeScript compiler
        run: |
          python3 tools/vendor_typescript.py
          python3 tools/vendor_typescript.py --check
      - name: Anchor release timestamps
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build distributions
        run: python -m build
      - name: Verify metadata and clean-install behavior
        run: |
          python -m twine check dist/*
          tools/verify_wheel.sh
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lachesis-${{ github.ref_name }}
          path: dist/
