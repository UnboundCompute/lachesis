name: release

# Tagging `vX.Y.Z` builds the platform wheels and the sdist, verifies each one from a
# clean environment, and publishes them to PyPI with an API token stored as the
# `PYPI_API_TOKEN` repository secret. The tag must match the pyproject version and have
# a CHANGELOG entry, or the run stops before anything is built.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    name: verify tag, version, and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag matches pyproject version and has a changelog entry
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag != version:
              raise SystemExit(f"tag v{tag} does not match pyproject version {version}")
          if f"## [{version}]" not in Path("CHANGELOG.md").read_text(encoding="utf-8"):
              raise SystemExit(f"CHANGELOG.md has no release heading for {version}")
          print(f"release version: {version}")
          PY

  sdist:
    name: build and verify the sdist
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Vendor the TypeScript compiler
        run: |
          python3 tools/vendor_typescript.py
          python3 tools/vendor_typescript.py --check
      - name: Bundle the Atropos catalog
        run: |
          python3 tools/vendor_atropos.py
          python3 tools/vendor_atropos.py --check
      - name: Anchor release timestamps
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build the sdist
        run: python -m build --sdist
      - name: Verify the sdist is reproducible
        run: |
          python tools/normalize_sdist.py dist/lachesis_cpg-*.tar.gz --epoch "$SOURCE_DATE_EPOCH"
          sha256sum dist/*.tar.gz > /tmp/sdist-first.sha256
          python -m build --sdist
          python tools/normalize_sdist.py dist/lachesis_cpg-*.tar.gz --epoch "$SOURCE_DATE_EPOCH"
          sha256sum -c /tmp/sdist-first.sha256
      - name: Check metadata and a clean install from the sdist
        run: |
          python -m twine check dist/*.tar.gz
          tools/verify_sdist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: wheel (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon (arm64); GitHub is retiring the Intel macos-13
        # runners and they queue unpredictably. We ship an arm64 macOS wheel only —
        # Intel-Mac users fall back to the sdist until cross-compilation is added.
        # ubuntu-24.04-arm is a native arm64 Linux runner: cibuildwheel builds the
        # manylinux_2_28_aarch64 wheel there without QEMU, so Linux arm64 hosts
        # (including Docker on Apple Silicon) get a real prebuilt wheel with the
        # native clang frontend, not a frontend-less sdist fallback.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # The native kernel and clang frontend are Rust; runners for macOS and Windows
      # ship a toolchain, and cibuildwheel installs one inside the Linux container.
      - name: Ensure a Rust toolchain (macOS/Windows host build)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
      # The vendored TypeScript compiler is host-side package data; stage it into the
      # tree before cibuildwheel copies the project into its build environment.
      - name: Vendor the TypeScript compiler
        run: |
          python3 tools/vendor_typescript.py
          python3 tools/vendor_typescript.py --check
      # The Atropos catalog is host-side package data too; stage it into the tree before
      # cibuildwheel copies the project into its build environment.
      - name: Bundle the Atropos catalog
        run: |
          python3 tools/vendor_atropos.py
          python3 tools/vendor_atropos.py --check
      - name: Build the platform wheel
        uses: pypa/cibuildwheel@v2.21
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # create the GitHub Release for the tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Show what will be published
        run: ls -l dist
      - name: Reject any non-platform wheel
        # A py3-none-any wheel would install everywhere and carry one platform's
        # binaries onto every other. setup.py never emits one; fail loudly if it appears.
        run: |
          if ls dist/*-none-any.whl >/dev/null 2>&1; then
            echo "refusing to publish a platform-agnostic wheel:" dist/*-none-any.whl
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check metadata on every distribution
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: Create the GitHub Release
        # The tag alone does not create a Release entry; publish one and attach the
        # built sdist and wheels so the /releases page mirrors what went to PyPI.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Lachesis ${GITHUB_REF_NAME}" \
            --notes "Lachesis ${GITHUB_REF_NAME}. See CHANGELOG.md for the full list of changes." \
            --verify-tag
