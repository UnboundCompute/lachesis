[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lachesis-cpg"
version = "0.1.0"
description = "A compiler-precise code property graph with an embedded columnar store and a navigation layer for security reasoning over source code."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Riyan Dhiman" }]
keywords = [
    "code-property-graph", "static-analysis", "dataflow", "taint-analysis",
    "kuzu", "mcp", "program-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

# The embedded columnar store is the graph store, so `kuzu` is required, and with it
# Python 3.10+. Everything else — the builder, the nav layer, the MCP server — is
# standard library, and new runtime dependencies still need justifying
# (see CONTRIBUTING.md). Floors track the releases the suite is verified against
# (kuzu 0.11.x, pyarrow 25.x); `pyarrow` only accelerates bulk load and the writer
# falls back to row-wise inserts without it.
dependencies = ["kuzu>=0.11", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
# The product surface. Everything below it is the engine, kept because a
# graph you hold yourself is a legitimate thing to want.
lachesis = "lachesis.cli.main:main"
lachesis-analyze = "lachesis.cli.analyze:main"
lachesis-query = "lachesis.cli.query:main"
lachesis-mcp = "lachesis.nav.mcp_server:main"
lachesis-plan = "lachesis.planner.cli:main"

[project.urls]
Homepage = "https://github.com/UnboundCompute/lachesis"
Source = "https://github.com/UnboundCompute/lachesis"
Issues = "https://github.com/UnboundCompute/lachesis/issues"
Changelog = "https://github.com/UnboundCompute/lachesis/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["lachesis*"]

[tool.setuptools.package-data]
# The TypeScript frontend is a Node script, the frontends declare capabilities in
# JSON, and the test suite runs against the shipped fixture trees. `vendor/` is the
# TypeScript compiler itself: it is absent from the repository and put in place by
# `tools/vendor_typescript.py` before a release build, so a wheel built without that
# step ships without it (see RELEASING.md).
"lachesis.frontends.typescript" = ["*.mjs", "*.json", "fixtures/**/*", "vendor/**/*"]
"lachesis.frontends.c" = ["*.json", "fixtures/**/*", "fixtures_crosstu/**/*", "fixtures_homonym/**/*", "fixtures_opsreg/**/*", "fixtures_opsreg_hdr/**/*"]
"lachesis.frontends.python" = ["*.json", "fixtures/**/*"]
"lachesis.core" = ["*.json"]
# The eager baseline the equality harness diffs every later phase against. It ships
# because the harness is only meaningful next to the recording it is judged against.
"lachesis.nav" = ["goldens/*.json.gz"]
# The capsule schema is the artifact an external consumer validates against, and the
# golden capsule is what the planner's own suite checks the serializer round-trips.
"lachesis.planner" = ["*.json", "fixtures/*.json", "fixtures/project/*"]

[tool.pytest.ini_options]
python_files = ["checks.py", "test_*.py"]
