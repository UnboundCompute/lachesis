[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lachesis-cpg"
version = "0.5.0"
description = "A compiler-precise code property graph with an embedded columnar store and a navigation layer for security reasoning over source code."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Riyan Dhiman" }]
keywords = [
    "code-property-graph", "static-analysis", "dataflow", "taint-analysis",
    "kuzu", "mcp", "program-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

# The embedded columnar store is the graph store, so `kuzu` is required, and with it
# Python 3.10+. Everything else — the builder, the nav layer, the MCP server — is
# standard library, and new runtime dependencies still need justifying
# (see CONTRIBUTING.md). Floors track the releases the suite is verified against
# (kuzu 0.11.x, pyarrow 25.x); `pyarrow` only accelerates bulk load and the writer
# falls back to row-wise inserts without it.
dependencies = ["kuzu>=0.11,<0.12", "pyarrow>=17,<26", "protobuf>=6.30,<8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Runtime only. Model weights are fetched separately by `lachesis concept-model
# download`; neither FastEmbed nor the model is part of the core wheel.
concept-search = ["fastembed>=0.8,<0.9"]

[project.scripts]
# One entrypoint. The reader is a single `lachesis` with subcommands; every pass
# and engine tool is a verb under it (build/enrich/analyze/query/plan/mcp/...).
lachesis = "lachesis.cli.main:main"

[project.urls]
Homepage = "https://github.com/UnboundCompute/lachesis"
Source = "https://github.com/UnboundCompute/lachesis"
Issues = "https://github.com/UnboundCompute/lachesis/issues"
Changelog = "https://github.com/UnboundCompute/lachesis/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["lachesis*"]
exclude = ["*.__pycache__", "lachesis.*.__pycache__", "lachesis.private", "lachesis.private.*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
# The TypeScript frontend is a Node script, the frontends declare capabilities in
# JSON, and the test suite runs against the shipped fixture trees. `vendor/` is the
# TypeScript compiler itself: it is absent from the repository and put in place by
# `tools/vendor_typescript.py` before a release build, so a wheel built without that
# step ships without it (see RELEASING.md).
"lachesis.frontends.typescript" = ["*.mjs", "*.json", "fixtures/**/*", "vendor/**/*"]
"lachesis.frontends.c" = ["*.json", "fixtures/**/*", "fixtures_crosstu/**/*", "fixtures_homonym/**/*", "fixtures_opsreg/**/*", "fixtures_opsreg_hdr/**/*"]
"lachesis.frontends.python" = ["*.json", "fixtures/**/*"]
"lachesis.core" = ["*.json", "*.proto"]
"lachesis.integrations.atropos" = ["fixtures_cslice/**/*"]
# The eager baseline the equality harness diffs every later phase against. It ships
# because the harness is only meaningful next to the recording it is judged against.
"lachesis.nav" = ["goldens/*.json.gz"]
# The capsule schema is the artifact an external consumer validates against, and the
# golden capsule is what the planner's own suite checks the serializer round-trips.
"lachesis.planner" = ["*.json", "fixtures/*.json", "fixtures/project/*"]
# The Atropos catalog (sink models, syntactic profiles, detection roles/patterns) is
# the data every catalog-keyed judgement reads. It is staged into `_atropos_catalog/`
# by `tools/vendor_atropos.py` before a release build -- absent from the repository for
# the same reason the TypeScript compiler is -- so a wheel built without that step ships
# without a bundled catalog and falls back to a sibling checkout at runtime.
"lachesis" = ["py.typed", "_native/*", "_atropos_catalog/**/*"]

# Never ship interpreter caches in release artifacts.  Fixture trees are included
# intentionally for frontend/runtime behavior, but their local `__pycache__`
# directories must not make wheels platform- or interpreter-dependent.
[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/**", "**/*.py[cod]"]

[tool.pytest.ini_options]
python_files = ["checks.py", "test_*.py"]

# Cross-platform wheels. The native payload (Rust lifetime kernel + clang frontend)
# is loaded through ctypes/subprocess, never as a CPython extension, so one
# `py3-none-<platform>` wheel per platform serves every supported interpreter (the
# tag is set in setup.py). We therefore build with a single interpreter to avoid
# emitting byte-identical duplicates. `before-build` compiles and stages the native
# artifacts into the package tree for the platform the wheel is being built on; the
# TypeScript compiler is vendored on the host before cibuildwheel runs.
[tool.cibuildwheel]
build = "cp311-*"
# 32-bit targets (win32, i686) are skipped: the kuzu and pyarrow runtime deps publish
# 64-bit wheels only, so a 32-bit build has no way to install them from a clean env.
skip = ["*-musllinux*", "pp*", "*-win32", "*_i686"]
before-build = "python {project}/tools/stage_native.py --build"
# A wheel that installs but whose native kernel cannot load is the exact regression
# this gate exists to catch, so drive a real end-to-end scan from the installed wheel.
test-command = "lachesis --version && lachesis doctor"

[tool.cibuildwheel.linux]
# The default manylinux2014 image predates the glibc 2.28 baseline that kuzu and
# pyarrow build their wheels against, so the clean-env test install can only source
# them by compiling from sdist (which fails). Build on manylinux_2_28 instead, where
# both ship prebuilt x86_64 wheels.
manylinux-x86_64-image = "manylinux_2_28"
# Same glibc 2.28 baseline for arm64: kuzu and pyarrow publish manylinux_2_28
# aarch64 wheels, so the clean-env test install resolves them without an sdist build.
manylinux-aarch64-image = "manylinux_2_28"
# manylinux containers ship no Rust toolchain; install it once per platform and put
# cargo on PATH for the staging step. protoc is vendored through the Cargo build, so
# no system protobuf compiler is required.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
