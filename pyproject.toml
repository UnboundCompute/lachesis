[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lachesis-cpg"
version = "0.1.0"
description = "A compiler-precise code property graph with an embedded columnar store and a navigation layer for security reasoning over source code."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Riyan Dhiman" }]
keywords = [
    "code-property-graph", "static-analysis", "dataflow", "taint-analysis",
    "kuzu", "mcp", "program-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

# The embedded columnar store is the graph store, so `kuzu` is required, and with it
# Python 3.10+. Everything else — the builder, the nav layer, the MCP server — is
# standard library, and new runtime dependencies still need justifying
# (see CONTRIBUTING.md). Floors track the releases the suite is verified against
# (kuzu 0.11.x, pyarrow 25.x); `pyarrow` only accelerates bulk load and the writer
# falls back to row-wise inserts without it.
dependencies = ["kuzu>=0.11", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lachesis-analyze = "Lachesis.cli.analyze:main"
lachesis-query = "Lachesis.cli.query:main"
lachesis-mcp = "nav.mcp_server:main"

[project.urls]
Homepage = "https://github.com/UnboundCompute/lachesis"
Source = "https://github.com/UnboundCompute/lachesis"

[tool.setuptools.packages.find]
include = ["Lachesis*", "nav*"]

[tool.setuptools.package-data]
# The TypeScript frontend is a Node script, the frontends declare capabilities in
# JSON, and the test suite runs against the shipped fixture trees.
"Lachesis.frontends.typescript" = ["*.mjs", "*.json", "fixtures/**/*"]
"Lachesis.frontends.c" = ["*.json", "fixtures/**/*", "fixtures_crosstu/**/*", "fixtures_opsreg/**/*", "fixtures_opsreg_hdr/**/*"]
"Lachesis.core" = ["*.json"]

[tool.pytest.ini_options]
python_files = ["checks.py", "test_*.py"]
