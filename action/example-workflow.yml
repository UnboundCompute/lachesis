# Copy this into a consuming repo as .github/workflows/lachesis.yml
name: lachesis
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v4

      - uses: UnboundCompute/lachesis/action@main   # no v1 tag yet; pin @main or a SHA
        with:
          source: "."
          # lachesis-ref: "main"                     # branch/tag/SHA of Lachesis to install
          # analyze-args: "--prune --incremental"    # light defaults
          # fail-on: "error"                          # fail the PR on guard differentials
          # changed-files: ""                         # limit reporting to a file list
