[package]
name = "lachesis-lifetime-kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
prost = "0.13"
serde = { version = "1", features = ["derive"] }
rayon = "1.10"
rustc-hash = "2"
hashbrown = "0.15"
sha2 = "0.10"

[build-dependencies]
prost-build = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
