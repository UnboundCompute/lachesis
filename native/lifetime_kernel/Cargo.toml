[package]
name = "lachesis-lifetime-kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
prost-build = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
